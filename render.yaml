services:
  # Backend Web Service (FastAPI + LangGraph)
  - type: web
    name: tripora-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEMO_MODE
        value: "true"
      - key: DEFAULT_CURRENCY
        value: INR
      - key: SECRET_KEY
        generateValue: true

  # Frontend Web Service (React + Vite)
  - type: web
    name: tripora-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tripora-backend
          property: url
